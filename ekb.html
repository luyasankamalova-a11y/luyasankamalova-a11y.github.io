<style>
  :root{
    --paper:#F3F1EC;
    --surface:#FAF9F6;
    --ink:#242522;
    --muted:#77766F;
    --sage:#4A5D4E;
    --sage-deep:#35443A;
    --terracotta:#C27D60;
    --line: rgba(36,37,34,0.10);
    --line-soft: rgba(36,37,34,0.06);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  img{ max-width:100%; }
  ::selection{ background:rgba(194,125,96,0.28); color:var(--ink); }

  h1,h2,h3,.font-display{ font-family:'Cormorant Garamond', Georgia, serif; }
  .balance{ text-wrap:balance; }

  a, button{ font-family:inherit; }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(74,93,78,0.32);
    border-radius:6px;
  }

  .kicker{
    font-size:0.7rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--sage);
    font-weight:600;
  }

  /* Nav */
  .nav-wrap{
    position:sticky; top:0; z-index:50;
    background:var(--paper);
    border-bottom:1px solid transparent;
    transition:border-color .35s ease;
  }
  .nav-wrap.scrolled{ border-color:var(--line); }

  /* Buttons */
  .btn-primary{
    display:inline-flex; align-items:center; gap:.5rem;
    background:var(--ink); color:var(--surface);
    padding:.85rem 1.5rem; border-radius:4px;
    font-weight:600; font-size:.88rem; letter-spacing:.01em;
    transition:background .3s ease, transform .3s ease;
  }
  .btn-primary:hover{ background:var(--sage-deep); transform:translateY(-1px); }
  .btn-primary.on-photo{ background:var(--surface); color:var(--ink); }
  .btn-primary.on-photo:hover{ background:#fff; }
  .btn-ghost{
    display:inline-flex; align-items:center; gap:.5rem;
    background:transparent; color:inherit;
    padding:.85rem 1.4rem; border-radius:4px;
    border:1px solid rgba(255,255,255,0.55);
    font-weight:600; font-size:.88rem;
    transition:border-color .3s ease, background .3s ease;
  }
  .btn-ghost:hover{ border-color:#fff; background:rgba(255,255,255,0.08); }
  .btn-ghost.on-paper{ border-color:rgba(36,37,34,0.28); color:var(--ink); }
  .btn-ghost.on-paper:hover{ border-color:var(--ink); background:rgba(36,37,34,0.04); }

  /* Filter pills */
  .pill{
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.55rem 1rem; border-radius:4px;
    font-size:.82rem; font-weight:600; white-space:nowrap;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    transition:all .25s ease;
    cursor:pointer;
  }
  .pill:hover{ border-color:var(--sage); color:var(--ink); }
  .pill.active{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .pill.heart-pill.active{ background:var(--terracotta); border-color:var(--terracotta); color:#fff; }

  /* Cards */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    transition:transform .35s ease, border-color .35s ease;
  }
  .card:hover{ transform:translateY(-3px); border-color:rgba(36,37,34,0.18); }
  .card-cover{ position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--sage-deep); }
  .card-cover img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .7s ease; }
  .card:hover .card-cover img{ transform:scale(1.03); }

  .cover-fallback{
    position:absolute; inset:0;
    display:flex; align-items:flex-end;
    padding:1.1rem;
    background:linear-gradient(155deg, var(--sage-deep), var(--ink) 130%);
  }
  .cover-fallback .fb-label{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic; font-size:1.4rem; color:rgba(250,249,246,0.9);
    line-height:1.2;
  }
  .cover-fallback .fb-rule{ width:28px; height:1px; background:rgba(250,249,246,0.5); margin-bottom:.6rem; }

  .tag-chip{
    position:absolute; left:.75rem; top:.75rem; z-index:2;
    background:rgba(36,37,34,0.55);
    color:#fff;
    font-size:.68rem; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase;
    padding:.32rem .65rem; border-radius:3px;
  }

  .heart-btn{
    position:absolute; right:.65rem; top:.65rem; z-index:2;
    width:2.15rem; height:2.15rem; border-radius:4px;
    background:rgba(36,37,34,0.5);
    display:flex; align-items:center; justify-content:center;
    transition:background .25s ease;
  }
  .heart-btn:hover{ background:rgba(36,37,34,0.7); }
  .heart-btn.saved{ background:var(--terracotta); }

  .tip-line{
    border-left:2px solid var(--terracotta);
    padding-left:.85rem;
  }

  /* Reveal on scroll */
  .reveal{ opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.is-visible{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .reveal{ opacity:1; transform:none; transition:none; }
    .card, .card-cover img, .btn-primary, .heart-btn{ transition:none; }
  }

  /* Hero */
  .hero-photo{ position:relative; overflow:hidden; background:var(--sage-deep); }
  .hero-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(36,37,34,0.32) 0%, rgba(36,37,34,0.30) 45%, rgba(36,37,34,0.82) 100%);
  }

  /* Timeline */
  .timeline-line{
    position:absolute; left:1.05rem; top:.4rem; bottom:.4rem; width:1px;
    background:var(--line);
  }
  @media (min-width:768px){ .timeline-line{ left:50%; transform:translateX(-50%); } }
  .timeline-dot{ width:.6rem; height:.6rem; border-radius:999px; background:var(--terracotta); }

  .footer-band{ background:var(--sage-deep); color:var(--surface); }
</style>
</head>

/* ---------- scroll reveal hook ---------- */

function useReveal(){
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const node = ref.current;
    if (!node) return;
    if (typeof IntersectionObserver === 'undefined'){ setVisible(true); return; }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setVisible(true); });
    }, { threshold: 0.15 });
    obs.observe(node);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({ className = '', children, delay = 0 }){
  const [ref, visible] = useReveal();
  return (
    <div ref={ref} className={`reveal ${visible ? 'is-visible' : ''} ${className}`} style={{ transitionDelay: visible ? `${delay}ms` : '0ms' }}>
      {children}
    </div>
  );
}

/* ---------- image with graceful fallback ---------- */

function PhotoOrFallback({ src, alt, label }){
  const [failed, setFailed] = useState(!src);
  if (failed || !src){
    return (
      <div className="cover-fallback">
        <div>
          <div className="fb-rule"></div>
          <p className="fb-label">{label}</p>
        </div>
      </div>
    );
  }
  return <img src={src} alt={alt} loading="lazy" onError={() => setFailed(true)} />;
}

function NavBar(){
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 12);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <header className={`nav-wrap ${scrolled ? 'scrolled' : ''}`}>
      <div className="max-w-6xl mx-auto flex items-center justify-between px-5 md:px-8 py-4">
        <a href="#top" className="font-body font-extrabold tracking-[0.14em] text-sm text-ink">

function PlacesSection({ saved, onToggleSave }){
  const [active, setActive] = useState('all');
  const [heartOnly, setHeartOnly] = useState(false);

  const filtered = useMemo(() => {
    return PLACES.filter(p => (active === 'all' || p.category === active) && (!heartOnly || saved.has(p.id)));
  }, [active, heartOnly, saved]);

  return (
    <section id="places" className="max-w-6xl mx-auto px-5 md:px-8 py-16 md:py-24">
      <Reveal>
        <p className="kicker mb-3">Коллекция мест</p>
        <h2 className="font-display text-4xl md:text-5xl text-ink mb-8 balance">Где город звучит по-особенному</h2>
      </Reveal>
      <Reveal delay={80} className="mb-10">
        <FilterTabs active={active} onChange={setActive} heartOnly={heartOnly} onToggleHeart={() => setHeartOnly(v => !v)} savedCount={saved.size} />
      </Reveal>

      {filtered.length === 0 ? (
        <Reveal className="text-muted text-sm py-10 text-center border border-dashed border-black/10 rounded-2xl">
          Пока пусто — сохрани пару мест сердечком, и они появятся здесь.
        </Reveal>
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-6">
          {filtered.map((p, i) => (
            <PlaceCard key={p.id} place={p} saved={saved.has(p.id)} onToggleSave={onToggleSave} delay={(i % 3) * 90} />
          ))}
        </div>
      )}
    </section>
  );
}

function App(){
  const [saved, setSaved] = useState(() => new Set());

  const toggleSave = (id) => {
    setSaved(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  return (
    <div className="min-h-screen bg-paper font-body">
      <NavBar />
      <Hero />
      <PlacesSection saved={saved} onToggleSave={toggleSave} />
      <RouteSection />
      <AboutCitySection />
      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
